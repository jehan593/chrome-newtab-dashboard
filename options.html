<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>New Tab Dashboard — Settings</title>
<link rel="stylesheet" href="css/nord.css" />
<style>
  body {
    padding: 16px;
    max-width: 980px;
    /* Inputs/buttons use inherit, so override to keep them small. */
    font-size: 13.5px;
  }
  h1 {
    font-size: 16px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 13px;
    margin: 0 0 16px;
  }
  .settings-card {
    background: var(--bg-elevated);
    border-radius: var(--radius);
    padding: 16px;
  }
  .settings-section-spaced {
    margin-bottom: 12px;
  }
  .settings-card h2 {
    margin: 0 0 14px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--text-muted);
  }
  .field {
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  input,
  select {
    width: 100%;
  }
  .hint {
    font-size: 11.5px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .widgets-hint {
    margin-top: 0;
    margin-bottom: 10px;
  }
  .row {
    display: flex;
    gap: 8px;
  }
  .status {
    margin-top: 10px;
    font-size: 12.5px;
    min-height: 16px;
  }
  .status.is-error {
    color: var(--danger);
  }
  .status.is-ok {
    color: var(--success);
  }
  /* Single status line: dot + text, replaces separate badge + paragraph. */
  .current {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 16px;
    padding: 9px 12px;
    background: var(--bg-nested);
    border-radius: var(--radius-sm);
  }
  .current-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    flex-shrink: 0;
  }
  .current.is-connected .current-dot {
    background: var(--success);
  }
  .current.is-connected {
    color: var(--text);
  }
  .current.is-warning .current-dot {
    background: var(--nord12);
  }
  .current.is-warning {
    color: var(--nord12);
  }
  .step-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }
  .calendar-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg-nested);
    border-radius: var(--radius-sm);
  }
  .calendar-list label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    margin: 0;
  }
  .calendar-list input[type="checkbox"] {
    width: auto;
    accent-color: var(--accent);
  }
  .widget-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .widget-row label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    margin: 0;
  }
  .widget-row input[type="checkbox"] {
    width: auto;
    accent-color: var(--accent);
  }
  .widget-drag-handle {
    cursor: grab;
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1;
    user-select: none;
  }
  .widget-row.dragging {
    opacity: 0.4;
  }
  .cal-swatch {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }

</style>
</head>
<body>
  <h1>New Tab Dashboard</h1>
  <p class="subtitle">Nextcloud calendar (view-only). Notes and tasks stay local.</p>

  <section class="settings-card settings-section-spaced">
    <h2>Widgets</h2>
    <p class="hint widgets-hint">
      Choose which widgets appear on the new tab page, and drag to reorder.
    </p>
    <div class="calendar-list" id="widget-toggle-list"></div>
  </section>

  <section class="settings-card settings-section-spaced" id="nextcloud-settings-card">
    <h2>Nextcloud Calendar</h2>

    <p class="current" id="current-connection">
      <span class="current-dot"></span>
      <span class="current-text">Not connected yet.</span>
    </p>

    <div class="field">
      <label for="base-url">1. Server URL</label>
      <input id="base-url" type="url" placeholder="https://cloud.example.com" />
      <p class="hint" id="base-url-hint">Logs in through your browser — no app password needed.</p>
    </div>

    <div class="row">
      <button type="button" class="btn-primary" id="connect-btn">Connect with Nextcloud login</button>
      <button type="button" class="btn-text" id="cancel-btn" hidden>Cancel</button>
    </div>

    <div class="field" id="calendars-field" hidden>
      <hr class="step-divider" />
      <label>2. Choose calendars</label>
      <div id="calendar-list" class="calendar-list"></div>
      <p class="hint">Merged into one view on the new tab page.</p>
    </div>

    <p class="status" id="status"></p>
  </section>

  <script type="module" src="js/options.js"></script>
</body>
</html>
