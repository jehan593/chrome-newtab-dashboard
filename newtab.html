<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>New Tab</title>
<link rel="stylesheet" href="css/nord.css" />
<link rel="stylesheet" href="css/layout.css" />
</head>
<body class="newtab">
  <div class="page">
    <div class="page-header">
      <button type="button" class="icon-btn theme-toggle" aria-label="Toggle theme" title="Toggle theme">◐</button>
      <button type="button" class="icon-btn settings-btn" aria-label="Settings" title="Settings">⚙</button>
    </div>
    <div class="grid">
      <section class="card is-large" id="calendar-widget"></section>
      <section class="card is-small" id="tasks-widget"></section>
      <section class="card is-small" id="notes-widget"></section>
      <section class="card is-small" id="weather-widget"></section>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
